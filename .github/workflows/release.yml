name: Build and publish desktop release
on:
  push:
    branches: [main]
    tags: ['v0.2.*']
    paths: ['desktop/**', 'scripts/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  # Package paths and regression fixtures include Chinese on every platform.
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
concurrency:
  group: desktop-release-${{ github.repository }}
  # Main and an explicit version tag share one queue. A newer publication
  # replaces an in-flight build instead of publishing duplicate release assets.
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, tomllib
          version = tomllib.load(open('desktop/Cargo.toml', 'rb'))['package']['version']
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag does not match Cargo version'
          print('version=' + version)
          PY
      - name: Release story and public source checks
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/check-release-notes.py
          python3 scripts/check-public-release.py --source .
  build:
    needs: metadata
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native macOS file-dialog script regression
        # Runs the shipped JXA source with a mocked Standard Additions host on
        # every runner; it must not open an interactive picker during CI.
        run: node desktop/scripts/test-file-dialog-macos.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'
      - name: Android verification tools
        run: sdkmanager "build-tools;36.0.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          cache-on-failure: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=2 update && sudo apt-get -o Acquire::Retries=2 install -y pkg-config clang libclang-dev libssl-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libdbus-1-dev
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - name: Remove build machine paths from artifacts
        shell: bash
        run: echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=/stepx-source" >> "$GITHUB_ENV"
      - name: Core tests
        # Live third-party store probes are explicit integration checks; native
        # storage, TCP framing and local download fixtures remain blocking gates.
        run: cargo test --locked --manifest-path desktop/Cargo.toml --no-default-features --lib --test contracts
      - name: Desktop state and interaction tests
        # Collect independent UI/runtime failures even when a core test fails.
        # Build and publication still require every test step to succeed.
        # Renderer benchmarks and fake-device processes share small CI hosts.
        # Run cases sequentially so CPU-heavy layout work cannot starve a
        # transport fixture's real deadlines. Tests that exercise concurrency
        # still start their own workers; no production timeout is relaxed.
        if: ${{ !cancelled() }}
        run: cargo test --locked --manifest-path desktop/Cargo.toml --bin stepx-companion -- --test-threads=1
      - name: Runtime and updater tests
        if: ${{ !cancelled() }}
        run: python scripts/ci-platform-smoke.py
      - name: macOS Retina text rendering regression
        if: runner.os == 'macOS' && success()
        run: python3 scripts/test-metal-glyph-fade.py
      - name: Isolated release homepage performance gate
        if: runner.os == 'Linux' && success()
        run: |
          python3 desktop/scripts/check-home-performance.py --self-test
          python3 desktop/scripts/check-home-performance.py --output artifacts/home-performance.json
      - name: Build
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml
      - name: Package and smoke test
        run: python scripts/package-release.py --platform ${{ matrix.platform }} --version ${{ needs.metadata.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified packages and videos
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          CURRENT_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$CURRENT_HEAD" = "$GITHUB_SHA" || { echo 'Refusing to publish superseded source'; exit 1; }
          NOTES_FILE="docs/RELEASE_${RELEASE_VERSION//./_}.md"
          test -s "$NOTES_FILE"
          # Bugfix releases may link to the previous demonstrations. If new
          # videos are supplied, both must exist and pass non-empty validation.
          python3 scripts/package-release.py --version "$RELEASE_VERSION" --stage-media-only
          if gh release view "v$RELEASE_VERSION" --json isDraft > /tmp/stepx-release.json 2>/dev/null; then
            test "$(jq -r .isDraft /tmp/stepx-release.json)" = true || { echo 'Refusing to replace a published release'; exit 1; }
            gh release upload "v$RELEASE_VERSION" dist/* --clobber
            gh release edit "v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "StepX Companion $RELEASE_VERSION · 以人为中心，让 AI 贯通终端与服务" --notes-file "$NOTES_FILE" --draft=false --latest
          else
            gh release create "v$RELEASE_VERSION" dist/* --target "$GITHUB_SHA" --title "StepX Companion $RELEASE_VERSION · 以人为中心，让 AI 贯通终端与服务" --notes-file "$NOTES_FILE" --latest
          fi
