name: Build desktop releases
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (without v)
        required: true
        default: '0.2.59'
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'
      - name: Android verification tools
        run: sdkmanager "build-tools;36.0.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y pkg-config clang libclang-dev libssl-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - name: Core tests
        run: cargo test --locked --manifest-path desktop/Cargo.toml --no-default-features --lib --test contracts
      - name: Desktop state and interaction tests
        run: cargo test --locked --manifest-path desktop/Cargo.toml --bin stepx-companion
      - name: Runtime and updater tests
        run: python scripts/ci-platform-smoke.py
      - name: Build
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml
      - name: Package and smoke test
        run: python scripts/package-release.py --platform ${{ matrix.platform }} --version ${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  draft-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft with all platforms
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cp desktop/assets/stepx-companion.apk dist/StepX-companion.apk
          (cd dist && sha256sum StepX-companion.apk > StepX-companion.apk.sha256)
          if gh release view "v$RELEASE_VERSION" --json isDraft > /tmp/stepx-release.json 2>/dev/null; then
            test "$(jq -r .isDraft /tmp/stepx-release.json)" = true || { echo 'Refusing to replace a published release'; exit 1; }
            gh release upload "v$RELEASE_VERSION" dist/* --clobber
            gh release edit "v$RELEASE_VERSION" --target "$GITHUB_SHA" --notes-file docs/RELEASE_NOTES.md
          else
            gh release create "v$RELEASE_VERSION" dist/* --target "$GITHUB_SHA" --draft --title "StepX Companion $RELEASE_VERSION · 应用商店、局域网投屏与可靠性修复" --notes-file docs/RELEASE_NOTES.md
          fi
